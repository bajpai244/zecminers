services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: zcash-clickhouse
    ports:
      - '8123:8123' # HTTP interface
      - '9000:9000' # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_DB=zcash
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=zcash123
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zcash-sync
    command: ['bun', 'run', 'src/sync.ts']
    environment:
      - ZCASH_RPC_URL=${ZCASH_RPC_URL}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=zcash
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=zcash123
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zcash-server
    command: ['bun', 'run', 'src/server.ts']
    ports:
      - '3000:3000'
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=zcash
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=zcash123
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: zcash-frontend
    ports:
      - '5173:80'
    depends_on:
      - server
    restart: unless-stopped

volumes:
  clickhouse_data:
